name: Build

# Builds the monorepo composite (luma-guilds, market, advancements, luma-sg,
# giveaway, votes) plus standalone artifacts such as EnthusiaToiletFlush on
# every push/PR. Verifies submodule pins are present and the build graph resolves.
# Mirrors the Fuji build workflow.

on:
  push:
    branches: [ main ]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - 'plugins/**'
      - 'ci/rosechat/**'
      - 'ci/enthusia-display/**'
      - 'scripts/build-display.py'
      - 'scripts/build-standalone.py'
      - 'scripts/test_build_standalone.py'
      - 'scripts/build-all.*'
      - 'scripts/build-tags.sh'
      - 'gradle/wrapper/**'
      - 'gradlew'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - 'plugins/**'
      - 'ci/rosechat/**'
      - 'ci/enthusia-display/**'
      - 'scripts/build-display.py'
      - 'scripts/build-standalone.py'
      - 'scripts/test_build_standalone.py'
      - 'scripts/build-all.*'
      - 'scripts/build-tags.sh'
      - 'gradle/wrapper/**'
      - 'gradlew'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_REF: 057836befb9e35aa252cf90104030ec86f28b33f
      USE_MAVEN_LOCAL_NEXUS: 'true'
      COMBATLOGX_API_REF: 4812e85af1264ebb27da481b9d9cbf8de0956e53
      # Fork PRs cannot receive the private Display read token. Build the public
      # monorepo there and reserve full Display validation for trusted runs.
      ENTHUSIADISPLAY_SKIP: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Checkout monorepo
        # v4 — pinned to commit SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false

      - name: Checkout public submodules
        run: |
          set -euo pipefail
          while read -r _ path; do
            if [ "$path" = "plugins/enthusia-display" ]; then
              continue
            fi
            git submodule update --init --recursive -- "$path"
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$')

      - name: Checkout private EnthusiaDisplay submodule
        if: env.ENTHUSIADISPLAY_SKIP != 'true'
        env:
          DISPLAY_READ_TOKEN: ${{ secrets.ENTHUSIADISPLAY_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$DISPLAY_READ_TOKEN" ]; then
            echo "::error::ENTHUSIADISPLAY_READ_TOKEN is required for trusted Display validation"
            exit 1
          fi
          auth_key="url.https://x-access-token:${DISPLAY_READ_TOKEN}@github.com/.insteadOf"
          git config --local "$auth_key" https://github.com/
          trap 'git config --local --unset-all "$auth_key" || true' EXIT
          git submodule update --init --recursive -- plugins/enthusia-display

      - name: Set up JDK 21
        # v4 — pinned to commit SHA
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate submodule pins present
        run: |
          set -euo pipefail
          paths="$(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')"
          missing=0
          while read -r path; do
            if [ -z "$path" ]; then
              continue
            fi
            if [ "$ENTHUSIADISPLAY_SKIP" = "true" ] && [ "$path" = "plugins/enthusia-display" ]; then
              echo "::warning::Skipping private EnthusiaDisplay checkout/build for fork PR"
              continue
            fi
            if [ ! -f "$path/build.gradle.kts" ] && [ ! -f "$path/build.gradle" ] && [ ! -f "$path/pom.xml" ] && [ ! -f "$path/server-plugin/pom.xml" ]; then
              echo "::error::submodule $path not checked out"
              missing=1
            fi
          done <<< "$paths"
          exit $missing

      - name: Set up verified Maven 3.9.11
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-3.9.11-bin.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --proto-redir '=https' \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.11/apache-maven-3.9.11-bin.tar.gz -o "$archive"
          printf '%s  %s\n' \
            bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978 \
            "$archive" | sha512sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/apache-maven-3.9.11/bin/mvn" --version
          echo "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      - name: Build Maven plugin dependencies
        run: |
          set -euo pipefail
          # EA (composite) compileOnly's against these Maven-built jars.
          # Build them first so target/ contains the exact jar names EA refs.
          for plugin in diary-keeper enthusia-currency playtime-plugin enthusia-commend; do
            echo "::group::mvn package $plugin"
            (cd "plugins/$plugin" && mvn -q -B package -DskipTests)
            echo "::endgroup::"
          done

      - name: Verify EnthusiaSignature and its tracker regressions
        working-directory: plugins/enthusia-signature
        run: mvn -B -ntp clean verify

      - name: Set up Python for asset verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Halloween asset importer
        working-directory: plugins/enthusia-signature
        run: |
          python -m pip install -r resourcepack/halloween/requirements.txt
          python -m unittest discover -s tools/resourcepack -p 'test_*.py' -v

      - name: Verify standalone build guards
        run: python -m unittest discover -s scripts -p 'test_build_standalone.py' -v

      - name: Stage EnthusiaPlaytime API for LumaGuilds
        run: |
          set -euo pipefail
          mapfile -t playtime_jars < <(find plugins/playtime-plugin/target -maxdepth 1 -type f \
            -name 'playtime-plugin-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          test "${#playtime_jars[@]}" -eq 1
          echo "ENTHUSIAPLAYTIME_JAR=$GITHUB_WORKSPACE/${playtime_jars[0]}" >> "$GITHUB_ENV"
          mkdir -p plugins/luma-guilds/libs "$RUNNER_TEMP/playtime-api"
          javac -d "$RUNNER_TEMP/playtime-api" \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/api/PlaytimeService.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/api/PlaytimeRange.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/api/PlaytimeMetric.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/activity/ActivityState.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/data/model/PlaytimeSnapshot.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/data/model/RangeTotals.java
          jar cf plugins/luma-guilds/libs/EnthusiaPlaytime-api.jar -C "$RUNNER_TEMP/playtime-api" .

      - name: Stage CombatLogX API for LumaGuilds
        run: |
          set -euo pipefail
          git clone https://github.com/SirBlobman/CombatLogX.git "$RUNNER_TEMP/combatlogx"
          (
            cd "$RUNNER_TEMP/combatlogx"
            git checkout "$COMBATLOGX_API_REF"
            chmod +x gradlew
            ./gradlew :api:jar --no-daemon
          )
          combatlogx_jar="$(find "$RUNNER_TEMP/combatlogx/api/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$combatlogx_jar"
          mkdir -p plugins/luma-guilds/libs
          cp "$combatlogx_jar" plugins/luma-guilds/libs/CombatLogX-api.jar

      - name: Build pinned Enthusia RoseChat
        run: |
          set -euo pipefail
          (
            cd plugins/rosechat
            chmod +x gradlew
            ./gradlew shadowJar --no-daemon --console=plain
          )
          rosechat_jar="$(find plugins/rosechat/build/libs -maxdepth 1 -type f -name 'RoseChat-*.jar' | head -1)"
          test -n "$rosechat_jar" || {
            echo "::error::RoseChat build produced no shaded jar"
            exit 1
          }
          mkdir -p plugins/luma-guilds/libs
          # LumaGuilds still uses this legacy local filename for compileOnly resolution.
          cp "$rosechat_jar" plugins/luma-guilds/libs/RoseChat-RC-2.jar

      - name: Set up JDK 25 for Paper 26.2 core
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify Tags with the pinned network pilot renderer
        run: bash scripts/build-tags.sh

      - name: Prepare EnthusiaDisplay compile APIs
        if: env.ENTHUSIADISPLAY_SKIP != 'true'
        env:
          UNT_URL: ${{ vars.ENTHUSIADISPLAY_UNT_JAR_URL }}
          UNT_SHA256: ${{ vars.ENTHUSIADISPLAY_UNT_JAR_SHA256 }}
          PAPI_URL: ${{ vars.ENTHUSIADISPLAY_PAPI_JAR_URL }}
          PAPI_SHA256: ${{ vars.ENTHUSIADISPLAY_PAPI_JAR_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$UNT_URL" ] || [ -z "$UNT_SHA256" ] || [ -z "$PAPI_URL" ] || [ -z "$PAPI_SHA256" ]; then
            echo "::error::Configure approved EnthusiaDisplay API URLs and SHA-256 repository variables; see ci/enthusia-display/README.md"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/display-api"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$UNT_URL" -o "$RUNNER_TEMP/display-api/UnlimitedNametags.jar"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' "$PAPI_URL" -o "$RUNNER_TEMP/display-api/PlaceholderAPI.jar"
          printf '%s  %s\n' "$UNT_SHA256" "$RUNNER_TEMP/display-api/UnlimitedNametags.jar" | sha256sum --check
          printf '%s  %s\n' "$PAPI_SHA256" "$RUNNER_TEMP/display-api/PlaceholderAPI.jar" | sha256sum --check
          echo "ENTHUSIADISPLAY_UNT_JAR=$RUNNER_TEMP/display-api/UnlimitedNametags.jar" >> "$GITHUB_ENV"
          echo "ENTHUSIADISPLAY_PAPI_JAR=$RUNNER_TEMP/display-api/PlaceholderAPI.jar" >> "$GITHUB_ENV"
          echo "ENTHUSIADISPLAY_ROSECHAT_BUILT=true" >> "$GITHUB_ENV"

      - name: Publish Nexus 2.3.0 dependency locally
        run: |
          set -euo pipefail
          git clone https://github.com/BadgersMC/Nexus.git "$RUNNER_TEMP/nexus"
          (
            cd "$RUNNER_TEMP/nexus"
            git checkout "$NEXUS_REF"
            chmod +x gradlew
            ./gradlew publishToMavenLocal --no-daemon --console=plain
          )

      - name: Build LumaGuilds 3.0 core artifact
        run: |
          set -euo pipefail
          (
            cd plugins/luma-guilds
            chmod +x gradlew
            ./gradlew shadowJar --no-daemon --console=plain
          )
          lumaguilds_jar="$(find plugins/luma-guilds/build/libs -maxdepth 1 -type f -name 'LumaGuilds-*.jar'             ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$lumaguilds_jar" || {
            echo "::error::LumaGuilds build produced no shaded jar"
            exit 1
          }
          echo "LUMAGUILDS_JAR=$GITHUB_WORKSPACE/$lumaguilds_jar" >> "$GITHUB_ENV"

      - name: Build EnthusiaMarket 26.2 artifact
        run: |
          set -euo pipefail
          (
            cd plugins/enthusia-market
            chmod +x gradlew
            ./gradlew shadowJar -PuseMavenLocal=true --no-daemon --console=plain
          )
          market_jar="$(find plugins/enthusia-market/build/libs -maxdepth 1 -type f -name 'EnthusiaMarket-*.jar'             ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$market_jar" || {
            echo "::error::EnthusiaMarket build produced no shaded jar"
            exit 1
          }
          echo "ENTHUSIAMARKET_JAR=$GITHUB_WORKSPACE/$market_jar" >> "$GITHUB_ENV"

      - name: Switch composite runner back to JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build composite plugins
        run: ./gradlew buildAll -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: List built JARs
        run: |
          find plugins -type f \( -path '*/build/libs/*.jar' -o -path '*/target/*.jar' \) \
            ! -name '*-dev*' ! -name '*-sources*' ! -name '*-javadoc*' ! -name 'original-*' | sort

name: Build

# Builds the monorepo composite (luma-guilds, market, advancements, luma-sg,
# giveaway, votes) on every push/PR. Verifies submodule pins are present and
# the composite resolves. Mirrors the Fuji build workflow.

on:
  push:
    branches: [ main ]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate submodule pins present
        run: |
          set -euo pipefail
          missing=0
          while read -r path; do
            if [ ! -f "$path/build.gradle.kts" ] && [ ! -f "$path/pom.xml" ]; then
              echo "::error::submodule $path not checked out"
              missing=1
            fi
          done < <(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')
          exit $missing

      - name: Build composite plugins
        run: ./gradlew buildAll

      - name: List built JARs
        run: |
          find plugins/*/build/libs -name '*.jar' -not -name '*-dev*' -not -name '*-sources*' 2>/dev/null | sort

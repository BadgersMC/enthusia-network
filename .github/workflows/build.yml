name: Build

# Builds the monorepo composite (luma-guilds, market, advancements, luma-sg,
# giveaway, votes) on every push/PR. Verifies submodule pins are present and
# the composite resolves. Mirrors the Fuji build workflow.

on:
  push:
    branches: [ main ]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - 'plugins/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - 'plugins/**'
      - 'gradle/wrapper/**'
      - 'gradlew'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo with submodules
        # v4 — pinned to commit SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        # v4 — pinned to commit SHA
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate submodule pins present
        run: |
          set -euo pipefail
          paths="$(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')"
          missing=0
          while read -r path; do
            if [ -z "$path" ]; then
              continue
            fi
            if [ ! -f "$path/build.gradle.kts" ] && [ ! -f "$path/build.gradle" ] && [ ! -f "$path/pom.xml" ]; then
              echo "::error::submodule $path not checked out"
              missing=1
            fi
          done <<< "$paths"
          exit $missing

      - name: Build Maven plugin dependencies
        run: |
          set -euo pipefail
          # EA (composite) compileOnly's against these Maven-built jars.
          # Build them first so target/ contains the exact jar names EA refs.
          for plugin in diary-keeper enthusia-currency playtime-plugin enthusia-commend; do
            echo "::group::mvn package $plugin"
            (cd "plugins/$plugin" && mvn -q -B package -DskipTests)
            echo "::endgroup::"
          done

      - name: Stage local compile-only jars
        run: |
          set -euo pipefail
          # luma-guilds compileOnly's against a gitignored RoseChat jar that
          # ships via SpigotMC only (no GitHub releases/tags; SpigotMC 403s
          # anonymous downloads; not on Modrinth). The committed copy in
          # ci/rosechat is the CI distribution path — verify it exists on the
          # fresh runner BEFORE staging, so a missing jar fails loudly here
          # instead of as a confusing compile error downstream.
          test -f ci/rosechat/RoseChat-RC-2.jar || {
            echo "::error::ci/rosechat/RoseChat-RC-2.jar missing on fresh runner — restore the committed file (it is tracked in this repo; a shallow/missing checkout is the only way it can be absent)"
            exit 1
          }
          mkdir -p plugins/luma-guilds/libs
          cp ci/rosechat/RoseChat-RC-2.jar plugins/luma-guilds/libs/RoseChat-RC-2.jar

      - name: Build composite plugins
        run: ./gradlew buildAll

      - name: List built JARs
        run: |
          find plugins/*/build/libs -name '*.jar' -not -name '*-dev*' -not -name '*-sources*' 2>/dev/null | sort

name: Build

# Builds the monorepo composite (luma-guilds, market, advancements, luma-sg,
# giveaway, votes) on every push/PR. Verifies submodule pins are present and
# the composite resolves. Mirrors the Fuji build workflow.

on:
  push:
    branches: [ main ]
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - 'plugins/**'
      - 'ci/rosechat/**'
      - 'scripts/build-all.*'
      - 'gradle/wrapper/**'
      - 'gradlew'
  pull_request:
    paths:
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/*.gradle.kts'
      - '.gitmodules'
      - '.github/workflows/build.yml'
      - 'plugins/**'
      - 'ci/rosechat/**'
      - 'scripts/build-all.*'
      - 'gradle/wrapper/**'
      - 'gradlew'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXUS_REF: 057836befb9e35aa252cf90104030ec86f28b33f
      USE_MAVEN_LOCAL_NEXUS: 'true'
      COMBATLOGX_API_REF: 4812e85af1264ebb27da481b9d9cbf8de0956e53
    steps:
      - name: Checkout monorepo with submodules
        # v4 — pinned to commit SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        # v4 — pinned to commit SHA
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate submodule pins present
        run: |
          set -euo pipefail
          paths="$(git config --file .gitmodules --get-regexp '^submodule\..*\.path$' | awk '{print $2}')"
          missing=0
          while read -r path; do
            if [ -z "$path" ]; then
              continue
            fi
            if [ ! -f "$path/build.gradle.kts" ] && [ ! -f "$path/build.gradle" ] && [ ! -f "$path/pom.xml" ]; then
              echo "::error::submodule $path not checked out"
              missing=1
            fi
          done <<< "$paths"
          exit $missing

      - name: Build Maven plugin dependencies
        run: |
          set -euo pipefail
          # EA (composite) compileOnly's against these Maven-built jars.
          # Build them first so target/ contains the exact jar names EA refs.
          for plugin in diary-keeper enthusia-currency playtime-plugin enthusia-commend; do
            echo "::group::mvn package $plugin"
            (cd "plugins/$plugin" && mvn -q -B package -DskipTests)
            echo "::endgroup::"
          done

      - name: Stage EnthusiaPlaytime API for LumaGuilds
        run: |
          set -euo pipefail
          mkdir -p plugins/luma-guilds/libs "$RUNNER_TEMP/playtime-api"
          javac -d "$RUNNER_TEMP/playtime-api" \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/api/PlaytimeService.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/api/PlaytimeRange.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/api/PlaytimeMetric.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/activity/ActivityState.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/data/model/PlaytimeSnapshot.java \
            plugins/playtime-plugin/src/main/java/org/enthusia/playtime/data/model/RangeTotals.java
          jar cf plugins/luma-guilds/libs/EnthusiaPlaytime-api.jar -C "$RUNNER_TEMP/playtime-api" .

      - name: Stage CombatLogX API for LumaGuilds
        run: |
          set -euo pipefail
          git clone https://github.com/SirBlobman/CombatLogX.git "$RUNNER_TEMP/combatlogx"
          (
            cd "$RUNNER_TEMP/combatlogx"
            git checkout "$COMBATLOGX_API_REF"
            chmod +x gradlew
            ./gradlew :api:jar --no-daemon
          )
          combatlogx_jar="$(find "$RUNNER_TEMP/combatlogx/api/build/libs" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$combatlogx_jar"
          mkdir -p plugins/luma-guilds/libs
          cp "$combatlogx_jar" plugins/luma-guilds/libs/CombatLogX-api.jar

      - name: Set up JDK 25 for Paper 26.2 core
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish Nexus 2.3.0 dependency locally
        run: |
          set -euo pipefail
          git clone https://github.com/BadgersMC/Nexus.git "$RUNNER_TEMP/nexus"
          (
            cd "$RUNNER_TEMP/nexus"
            git checkout "$NEXUS_REF"
            chmod +x gradlew
            ./gradlew publishToMavenLocal --no-daemon --console=plain
          )

      - name: Build pinned Enthusia RoseChat
        run: |
          set -euo pipefail
          (
            cd plugins/rosechat
            chmod +x gradlew
            ./gradlew shadowJar --no-daemon --console=plain
          )
          rosechat_jar="$(find plugins/rosechat/build/libs -maxdepth 1 -type f -name 'RoseChat-*.jar' | head -1)"
          test -n "$rosechat_jar" || {
            echo "::error::RoseChat build produced no shaded jar"
            exit 1
          }
          mkdir -p plugins/luma-guilds/libs
          # LumaGuilds still uses this legacy local filename for compileOnly resolution.
          cp "$rosechat_jar" plugins/luma-guilds/libs/RoseChat-RC-2.jar

      - name: Build LumaGuilds 3.0 core artifact
        run: |
          set -euo pipefail
          (
            cd plugins/luma-guilds
            chmod +x gradlew
            ./gradlew shadowJar --no-daemon --console=plain
          )
          lumaguilds_jar="$(find plugins/luma-guilds/build/libs -maxdepth 1 -type f -name 'LumaGuilds-*.jar'             ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$lumaguilds_jar" || {
            echo "::error::LumaGuilds build produced no shaded jar"
            exit 1
          }
          echo "LUMAGUILDS_JAR=$GITHUB_WORKSPACE/$lumaguilds_jar" >> "$GITHUB_ENV"

      - name: Build EnthusiaMarket 26.2 artifact
        run: |
          set -euo pipefail
          (
            cd plugins/enthusia-market
            chmod +x gradlew
            ./gradlew shadowJar -PuseMavenLocal=true --no-daemon --console=plain
          )
          market_jar="$(find plugins/enthusia-market/build/libs -maxdepth 1 -type f -name 'EnthusiaMarket-*.jar'             ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -1)"
          test -n "$market_jar" || {
            echo "::error::EnthusiaMarket build produced no shaded jar"
            exit 1
          }
          echo "ENTHUSIAMARKET_JAR=$GITHUB_WORKSPACE/$market_jar" >> "$GITHUB_ENV"

      - name: Switch composite runner back to JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Build composite plugins
        run: ./gradlew buildAll -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64

      - name: List built JARs
        run: |
          find plugins/*/build/libs -name '*.jar' -not -name '*-dev*' -not -name '*-sources*' 2>/dev/null | sort

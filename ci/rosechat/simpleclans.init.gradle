// Build-only dependency substitution for RoseChat.
// SimpleClans' canonical Maven endpoint intermittently fails TLS negotiation.
// Use the same 2.19.2 binary from Modrinth without modifying RoseChat source.
allprojects {
    repositories {
        maven { url = uri('https://api.modrinth.com/maven') }
    }
    configurations.configureEach {
        resolutionStrategy.dependencySubstitution {
            substitute module('net.sacredlabyrinth.phaed.simpleclans:SimpleClans') using module('maven.modrinth:quLDfyDl:xlIV342T')
        }
    }
}
